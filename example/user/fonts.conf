<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <match target="font">
        <edit name="antialias" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hinting" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hintstyle" mode="assign">
            <const>hintfull</const>
        </edit>
        <edit name="rgba" mode="assign">
            <const>rgb</const>
        </edit>
        <edit name="autohint" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="lcdfilter" mode="assign">
            <const>lcddefault</const>
        </edit>
        <edit name="dpi" mode="assign">
            <double>142</double>
        </edit>
    </match>
    <match target="font">
        <test name="family">
            <string>Arsenal</string>
        </test>
        <edit name="pixelsize" mode="assign">
            <times><name>pixelsize</name>, <double>2</double></times>
        </edit>
    </match>
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Lato</family>
            <family>JoyPixels</family>
            <family>Twitter Color Emoji</family>
            <family>MacPaw Fixel Text</family>
            <family>MacPaw Fixel Display</family>
            <family>PT Sans</family>
            <family>Arsenal</family>
        </prefer>
    </alias>
    <alias>
        <family>serif</family>
        <prefer>
            <family>Lato</family>
            <family>JoyPixels</family>
            <family>Twitter Color Emoji</family>
            <family>MacPaw Fixel Text</family>
            <family>MacPaw Fixel Display</family>
            <family>PT Serif</family>
            <family>Arsenal</family>
            <family>Vollkorn</family>
        </prefer>
    </alias>
    <alias>
        <family>monospace</family>
        <prefer>
            <family>JetBrainsMono Nerd Font Mono</family>
            <family>JetBrains Mono</family>
            <family>PT Mono</family>
            <family>JoyPixels</family>
            <family>Twitter Color Emoji</family>
        </prefer>
    </alias>
</fontconfig>
