# main nginx config

worker_processes auto;
worker_cpu_affinity auto;
error_log /var/log/nginx/nginx.error.log;
load_module "/usr/local/libexec/nginx/ngx_http_brotli_filter_module.so";
include "/usr/local/etc/nginx/local.conf";

events {
	worker_connections 8192;
	use kqueue;
}

http {
	include mime.types;
	default_type application/octet-stream;
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;

	brotli on;
	brotli_types text/plain text/xhtml text/css text/js application/x-javascript application/javascript;

	#server_names_hash_bucket_size 64;
	#proxy_set_header_hash_bucket_size 64;
	proxy_http_version 1.1;
	proxy_redirect off;
	keepalive_timeout 70;
	root /var/empty;

	open_file_cache max=4096 inactive=600s;

	include "/usr/local/etc/nginx/local/*.conf";
}
